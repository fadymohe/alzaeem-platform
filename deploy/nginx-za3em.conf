# ==============================================================================
# za3em.shop - Nginx Wildcard Reverse Proxy Configuration
# يدعم التوجيه الديناميكي للنطاقات الفرعية (*.za3em.shop) والنطاق الأساسي
# ==============================================================================

# 1. إعادة توجيه كافة طلبات HTTP إلى HTTPS المشفرة
server {
    listen 80;
    listen [::]:80;
    server_name za3em.shop *.za3em.shop;

    # مسار التحقق من شهادة Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. خادم HTTPS الرئيسي مع دعم ترويسات النطاق الفرعي (Wildcard SSL)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name za3em.shop *.za3em.shop;

    # شهادات الأمان (Let's Encrypt Wildcard Certificate)
    ssl_certificate /etc/letsencrypt/live/za3em.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/za3em.shop/privkey.pem;

    # إعدادات الأمان والتشفير العالي
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ضغط Gzip لتسريع تحميل صفحات الهبوط الفورية
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_comp_level 6;
    gzip_min_length 256;

    # الترويسات الأساسية لنقل النطاق الفرعي بدقة إلى Node.js Express & React
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # مسار واجهات برمجة التطبيقات (API)
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # مسار تطبيق الواجهة الأمامية وصفحات الهبوط (SPA & Landing Pages)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
